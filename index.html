  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'suzuyun-sanity-deadlock';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    let dbInstance = null;
    let authInstance = null;
    let docRef = null;

    window.FirebaseStore = {
      appId,
      isConfigured: !!firebaseConfig,
      init: async (onData, onError) => {
        if (!firebaseConfig) {
          console.warn("No Firebase config detected. Using localStorage persistence mode.");
          return null;
        }
        try {
          const app = initializeApp(firebaseConfig);
          authInstance = getAuth(app);
          dbInstance = getFirestore(app);

          let userCred;
          if (initialAuthToken) {
            userCred = await signInWithCustomToken(authInstance, initialAuthToken);
          } else {
            userCred = await signInAnonymously(authInstance);
          }

          if (!userCred || !userCred.user) {
            throw new Error("Firebase authentication failed.");
          }

          // Rule 1 strictly followed: /artifacts/{appId}/public/data/{collectionName}/{docId}
          docRef = doc(dbInstance, 'artifacts', appId, 'public', 'data', 'tournament', 'stateDoc');

          const unsubscribe = onSnapshot(docRef, (snapshot) => {
            if (snapshot.exists()) {
              onData(snapshot.data());
            }
          }, (err) => {
            console.error("Firestore snapshot error:", err);
            if (onError) onError(err);
          });

          return {
            saveState: async (data) => {
              if (!authInstance || !authInstance.currentUser || !docRef) return;
              await setDoc(docRef, data, { merge: true });
            },
            unsubscribe
          };
        } catch (err) {
          console.error("Firebase init failed:", err);
          if (onError) onError(err);
          return null;
        }
      }
    };
  </script>

    // Helper: Series Score Calculation
    function calcMatchResult(match) {
      if (!match || !match.games) return { scoreA: 0, scoreB: 0, winner: null, loser: null, isCompleted: false };
      let scoreA = 0;
      let scoreB = 0;
      match.games.forEach(g => {
        if (g.winner === 'teamA') scoreA++;
        if (g.winner === 'teamB') scoreB++;
      });

      let winner = null;
      let loser = null;
      if (scoreA >= 2) {
        winner = match.teamAId;
        loser = match.teamBId;
      } else if (scoreB >= 2) {
        winner = match.teamBId;
        loser = match.teamAId;
      }

      return {
        scoreA,
        scoreB,
        winner,
        loser,
        isCompleted: scoreA >= 2 || scoreB >= 2
      };
    }

                    {teamB ? teamB.name : "TBD"}
                  </div>
                  {teamB && teamB.streamer && (
                    <div class="text-[10px] text-amber-400/80 font-mono flex items-center gap-1">
                      📡 {teamB.streamer}
                    </div>
                  )}
                </div>
              </div>

              <div class="flex items-center gap-3">
                <div class="flex items-center gap-1">
                  {match.games.map((g, idx) => (
                    <span
                      key={idx}
                      class={`w-2.5 h-2.5 rounded-full ${
                        g.winner === 'teamB' ? 'bg-sapphire-400 shadow-[0_0_6px_rgba(56,189,248,0.8)]' : 'bg-obsidian-700'
                      }`}
                    ></span>
                  ))}
                </div>
                <span class={`text-base font-extrabold font-mono w-6 text-right ${res.winner === match.teamBId ? "text-brass-400" : "text-slate-300"}`}>
                  {res.scoreB}
                </span>
              </div>
            </div>
          </div>

          <div class="bg-obsidian-950/60 px-4 py-1.5 text-center text-[10px] text-slate-400 group-hover:text-brass-400 transition border-t border-obsidian-800 flex items-center justify-between">
            <span>📸 Verified Screenshots: {match.games.filter(g => g.screenshotVerified).length}/{match.games.length}</span>
            <span>Click to Edit Score &amp; Bans ✎</span>
          </div>
        </div>
      );
    }

    function StatusBadge({ status }) {
      if (status === 'live') {
        return (
          <span class="bg-red-500/20 text-red-400 border border-red-500/40 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider animate-pulse flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span> LIVE
          </span>
        );
      }
      if (status === 'completed') {
        return (
          <span class="bg-brass-500/20 text-brass-300 border border-brass-500/40 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
            ✓ ENDED
          </span>
        );
      }
      return (
        <span class="bg-slate-800 text-slate-400 border border-slate-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">
          UPCOMING
        </span>
      );
    }

    // --- TEAM CARD EDITOR ---
    function TeamCardEditor({ team, onUpdate }) {
      const [name, setName] = useState(team.name);
      const [tag, setTag] = useState(team.tag);
      const [streamer, setStreamer] = useState(team.streamer || "");
      const [roster, setRoster] = useState(team.roster);

      const handlePlayerChange = (index, field, value) => {
        const updated = [...roster];
        updated[index] = { ...updated[index], [field]: value };
        setRoster(updated);
      };

      const handleSave = () => {
        onUpdate({
          ...team,
          name,
          tag,
          streamer,
          roster
        });
      };

      return (
        <div class="bg-obsidian-900 border border-brass-500/30 rounded-xl p-5 space-y-4 shadow-xl">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-obsidian-700 pb-3">
            <div class="flex items-center gap-3">
              <span class="w-8 h-8 rounded bg-brass-500/20 border border-brass-400 text-brass-300 font-black flex items-center justify-center text-sm font-mono">
                #{team.seed}
              </span>
              <input
                type="text"
                value={name}
                onChange={(e) => setName(e.target.value)}
                class="font-deco font-bold text-white bg-obsidian-950 px-2 py-1 rounded border border-obsidian-700 focus:border-brass-400 text-sm focus:outline-none"
                placeholder="Team Name"
              />
            </div>

            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-400 font-mono">TAG:</span>
              <input
                type="text"
                value={tag}
                onChange={(e) => setTag(e.target.value.toUpperCase())}
                maxLength="5"
                class="w-14 font-mono font-bold text-amber-300 bg-obsidian-950 px-2 py-1 rounded border border-obsidian-700 text-xs focus:border-brass-400 uppercase text-center focus:outline-none"
              />
              <button
                onClick={handleSave}
                class="bg-brass-500 hover:bg-brass-400 text-obsidian-950 font-bold text-xs px-3 py-1.5 rounded shadow transition"
              >
                💾 Save Team
              </button>
            </div>
          </div>

          <div class="bg-amber-950/30 border border-amber-800/40 p-2.5 rounded-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs">
            <span class="font-semibold text-amber-300 flex items-center gap-1">
              📡 Designated Team Streamer (Required):
            </span>
            <input
              type="text"
              value={streamer}
              onChange={(e) => setStreamer(e.target.value)}
              placeholder="twitch.tv/streamerhandle"
              class="w-full sm:w-64 bg-obsidian-950 text-slate-200 px-2 py-1 rounded border border-obsidian-700 focus:border-amber-400 focus:outline-none font-mono"
            />
          </div>

          <div>
            <div class="text-xs font-bold text-brass-400 uppercase mb-2 flex items-center justify-between">
              <span>6v6 Roster Lineup</span>
              <span class="text-[10px] text-slate-400">Player Handle &amp; Hero</span>
            </div>

            <div class="space-y-2">
              {roster.map((player, idx) => (
                <div key={player.id} class="flex items-center gap-2 bg-obsidian-950/70 p-2 rounded border border-obsidian-800 text-xs">
                  <span class="text-slate-500 font-mono w-4">{idx + 1}.</span>
                  <input
                    type="text"
                    value={player.name}
                    onChange={(e) => handlePlayerChange(idx, "name", e.target.value)}
                    class="bg-obsidian-900 text-slate-200 px-2 py-1 rounded border border-obsidian-700 w-1/3 focus:border-brass-400 focus:outline-none"
                    placeholder="Player Handle"
                  />
                  <select
                    value={player.hero}
                    onChange={(e) => handlePlayerChange(idx, "hero", e.target.value)}
                    class="bg-obsidian-900 text-amber-300 px-2 py-1 rounded border border-obsidian-700 w-1/3 focus:border-brass-400 focus:outline-none"
                  >
                    {HEROES.map(h => (
                      <option key={h.id} value={h.name}>{h.icon} {h.name}</option>
                    ))}
                  </select>
                  <input
                    type="text"
                    value={player.role}
                    onChange={(e) => handlePlayerChange(idx, "role", e.target.value)}
                    class="bg-obsidian-900 text-slate-400 px-2 py-1 rounded border border-obsidian-700 w-1/3 focus:border-brass-400 focus:outline-none"
                    placeholder="Role"
                  />
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- MATCH EDITOR MODAL WITH NO REPEAT HERO LOCK TRACKER ---
    function MatchEditorModal({ match, teams, onClose, onSave }) {
      const [currentMatch, setCurrentMatch] = useState(JSON.parse(JSON.stringify(match)));
      const teamA = teams.find(t => t.id === currentMatch.teamAId);
      const teamB = teams.find(t => t.id === currentMatch.teamBId);

      const res = calcMatchResult(currentMatch);

      const handleGameUpdate = (gameIdx, field, val) => {
        const updatedGames = [...currentMatch.games];
        updatedGames[gameIdx] = { ...updatedGames[gameIdx], [field]: val };
        setCurrentMatch({ ...currentMatch, games: updatedGames });
      };

      const handleBanChange = (gameIdx, teamKey, banIdx, heroName) => {
        const updatedGames = [...currentMatch.games];
        const bansField = teamKey === 'A' ? 'bansA' : 'bansB';
        const currentBans = [...(updatedGames[gameIdx][bansField] || ["", ""])];
        currentBans[banIdx] = heroName;
        updatedGames[gameIdx][bansField] = currentBans;
        setCurrentMatch({ ...currentMatch, games: updatedGames });
      };

      // Track played heroes across series to detect duplicates (No Repeat Hero Rule)
      const seriesHeroUsageA = useMemo(() => {
        const list = [];
        currentMatch.games.forEach(g => {
          if (g.heroesA) list.push(...g.heroesA);
        });
        return list;
      }, [currentMatch]);

      const seriesHeroUsageB = useMemo(() => {
        const list = [];
        currentMatch.games.forEach(g => {
          if (g.heroesB) list.push(...g.heroesB);
        });
        return list;
      }, [currentMatch]);

      return (
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-obsidian-900 border border-brass-400 rounded-xl max-w-4xl w-full p-6 space-y-6 shadow-2xl my-8 relative">
            
            {/* Header */}
            <div class="flex items-center justify-between border-b border-obsidian-700 pb-3">
              <div>
                <span class="text-xs font-bold text-brass-400 uppercase tracking-widest">
                  MATCH RESULT, BANS &amp; HERO LOCKS
                </span>
                <h3 class="text-xl font-deco font-extrabold text-white">
                  {currentMatch.roundLabel}
                </h3>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white text-2xl font-bold">✕</button>
            </div>

            {/* Score Overview & Stream Setting */}
            <div class="bg-obsidian-950 p-4 rounded-xl border border-brass-500/30 flex flex-col md:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-6">
                <div>
                  <div class="text-sm font-bold text-brass-300">
                    {teamA ? `${teamA.name} [${teamA.tag}]` : "Team A"}
                  </div>
                  <div class="text-3xl font-black font-mono text-white mt-1">{res.scoreA}</div>
                </div>

                <div class="text-slate-500 font-mono text-xl">VS</div>

                <div>
                  <div class="text-sm font-bold text-brass-300">
                    {teamB ? `${teamB.name} [${teamB.tag}]` : "Team B"}
                  </div>
                  <div class="text-3xl font-black font-mono text-white mt-1">{res.scoreB}</div>
                </div>
              </div>

              <div class="flex flex-col gap-2">
                <div class="flex items-center gap-2 text-xs">
                  <span class="text-slate-400">Stream Broadcast:</span>
                  <select
                    value={currentMatch.streamMode}
                    onChange={(e) => setCurrentMatch({ ...currentMatch, streamMode: e.target.value })}
                    class="bg-obsidian-800 text-amber-300 px-2 py-1 rounded border border-obsidian-700 font-semibold focus:outline-none"
                  >
                    <option value="Main Stream">📺 Main Stream</option>
                    <option value="Off-Stream (To Save Time)">🎬 Off-Stream (To Save Time)</option>
                  </select>
                </div>

                <div class="flex items-center gap-2 text-xs">
                  <span class="text-slate-400">Status:</span>
                  <select
                    value={currentMatch.status}
                    onChange={(e) => setCurrentMatch({ ...currentMatch, status: e.target.value })}
                    class="bg-obsidian-800 text-white px-2 py-1 rounded border border-obsidian-700 focus:outline-none"
                  >
                    <option value="upcoming">Upcoming</option>
                    <option value="live">Live</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Individual Games */}
            <div class="space-y-4">
              {currentMatch.games.map((game, gIdx) => (
                <div key={gIdx} class="bg-obsidian-950 p-4 rounded-lg border border-obsidian-700 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-obsidian-800 pb-2">
                    <span class="font-deco font-bold text-brass-400 text-sm">
                      GAME {gIdx + 1}
                    </span>

                    <div class="flex items-center gap-4 text-xs">
                      <div class="flex items-center gap-1.5">
                        <span class="text-slate-400">Game Winner:</span>
                        <select
                          value={game.winner || ""}
                          onChange={(e) => handleGameUpdate(gIdx, "winner", e.target.value || null)}
                          class="bg-obsidian-800 text-amber-300 font-bold px-2 py-1 rounded border border-obsidian-700 focus:outline-none"
                        >
                          <option value="">-- Unplayed --</option>
                          <option value="teamA">{teamA ? teamA.name : "Team A"}</option>
                          <option value="teamB">{teamB ? teamB.name : "Team B"}</option>
                        </select>
                      </div>

                      <label class="flex items-center gap-1.5 cursor-pointer bg-obsidian-900 border border-obsidian-700 px-2 py-1 rounded">
                        <input
                          type="checkbox"
                          checked={game.screenshotVerified || false}
                          onChange={(e) => handleGameUpdate(gIdx, "screenshotVerified", e.target.checked)}
                          class="accent-brass-500"
                        />
                        <span class={game.screenshotVerified ? "text-emerald-400 font-bold" : "text-slate-400"}>
                          📸 Screenshot Verified
                        </span>
                      </label>
                    </div>
                  </div>

                  {/* 2 Bans per Team = 4 Bans Total */}
                  <div class="bg-obsidian-900/80 p-3 rounded border border-obsidian-800 space-y-2 text-xs">
                    <div class="font-semibold text-brass-400">
                      🚫 Hero Bans (2 per team = 4 total per game)
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <span class="text-slate-400 font-mono text-[11px] block mb-1">
                          {teamA ? teamA.tag : "Team A"} Bans:
                        </span>
                        <div class="flex gap-2">
                          {[0, 1].map(bIdx => (
                            <select
                              key={bIdx}
                              value={(game.bansA && game.bansA[bIdx]) || ""}
                              onChange={(e) => handleBanChange(gIdx, 'A', bIdx, e.target.value)}
                              class="bg-obsidian-950 text-red-300 px-2 py-1 rounded border border-obsidian-700 w-full focus:outline-none"
                            >
                              <option value="">Ban {bIdx + 1}</option>
                              {HEROES.map(h => (
                                <option key={h.id} value={h.name}>{h.name}</option>
                              ))}
                            </select>
                          ))}
                        </div>
                      </div>

                      <div>
                        <span class="text-slate-400 font-mono text-[11px] block mb-1">
                          {teamB ? teamB.tag : "Team B"} Bans:
                        </span>
                        <div class="flex gap-2">
                          {[0, 1].map(bIdx => (
                            <select
                              key={bIdx}
                              value={(game.bansB && game.bansB[bIdx]) || ""}
                              onChange={(e) => handleBanChange(gIdx, 'B', bIdx, e.target.value)}
                              class="bg-obsidian-950 text-red-300 px-2 py-1 rounded border border-obsidian-700 w-full focus:outline-none"
                            >
                              <option value="">Ban {bIdx + 1}</option>
                              {HEROES.map(h => (
                                <option key={h.id} value={h.name}>{h.name}</option>
                              ))}
                            </select>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Sides & Notes */}
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                      <span class="text-slate-400 block mb-1">{teamA ? teamA.tag : "Team A"} Side:</span>
                      <select
                        value={game.sideA}
                        onChange={(e) => handleGameUpdate(gIdx, "sideA", e.target.value)}
                        class="w-full bg-obsidian-900 text-amber-400 px-2 py-1 rounded border border-obsidian-800"
                      >
                        <option value="Amber Hand">Amber Hand 🟡</option>
                        <option value="Sapphire Flame">Sapphire Flame 🔵</option>
                      </select>
                    </div>

                    <div>
                      <span class="text-slate-400 block mb-1">{teamB ? teamB.tag : "Team B"} Side:</span>
                      <select
                        value={game.sideB}
                        onChange={(e) => handleGameUpdate(gIdx, "sideB", e.target.value)}
                        class="w-full bg-obsidian-900 text-sapphire-400 px-2 py-1 rounded border border-obsidian-800"
                      >
                        <option value="Sapphire Flame">Sapphire Flame 🔵</option>
                        <option value="Amber Hand">Amber Hand 🟡</option>
                      </select>
                    </div>

                    <div>
                      <span class="text-slate-400 block mb-1">MVP / Notes:</span>
                      <input
                        type="text"
                        placeholder="Player handle or notes"
                        value={game.mvp || ""}
                        onChange={(e) => handleGameUpdate(gIdx, "mvp", e.target.value)}
                        class="w-full bg-obsidian-900 text-slate-200 px-2 py-1 rounded border border-obsidian-800"
                      />
                    </div>
                  </div>

                </div>
              ))}
            </div>

            {/* Actions */}
            <div class="flex items-center justify-end gap-3 border-t border-obsidian-700 pt-4">
              <button
                onClick={onClose}
                class="bg-obsidian-800 hover:bg-obsidian-700 text-slate-300 text-xs px-4 py-2 rounded font-semibold"
              >
                Cancel
              </button>
              <button
                onClick={() => onSave(currentMatch)}
                class="bg-brass-500 hover:bg-brass-400 text-obsidian-950 font-bold text-xs px-5 py-2 rounded shadow"
              >
                💾 Save Match Changes
              </button>
            </div>

          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
